<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#090510"/>
      <stop offset="1" stop-color="#1A1028"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#4C1D95"/>
    </radialGradient>
  </defs>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- twinkling stars -->
  <g fill="#E9D5FF">
    <circle cx="40" cy="30" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="150" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="60" r="2"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="190" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="40" r="1.5"><animate attributeName="opacity" values="1;0.1;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="170" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="25" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="120" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="200" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="50" r="2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="140" r="1"><animate attributeName="opacity" values="1;0.1;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="95" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- slowly drifting planet -->
  <g>
    <circle cx="760" cy="150" r="38" fill="url(#planet)"/>
    <ellipse cx="760" cy="150" rx="62" ry="10" fill="none" stroke="#A78BFA" stroke-opacity="0.6" stroke-width="2" transform="rotate(-18 760 150)"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-6,4;0,0" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- shooting star -->
  <line x1="0" y1="0" x2="-60" y2="0" stroke="#E9D5FF" stroke-width="2" stroke-linecap="round" opacity="0">
    <animateTransform attributeName="transform" type="translate" values="900,20;500,120" dur="4s" begin="1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/>
  </line>

  <!-- spaceship -->
  <g>
    <g transform="translate(0,105)">
      <!-- flame -->
      <polygon points="-34,0 -62,-8 -52,0 -62,8" fill="#F0ABFC">
        <animate attributeName="points" values="-34,0 -62,-8 -52,0 -62,8;-34,0 -78,-6 -60,0 -78,6;-34,0 -62,-8 -52,0 -62,8" dur="0.3s" repeatCount="indefinite"/>
      </polygon>
      <!-- body -->
      <path d="M-34,-12 L20,-12 Q48,0 20,12 L-34,12 Z" fill="#E9D5FF"/>
      <path d="M-34,-12 L-46,-26 L-20,-12 Z" fill="#8B5CF6"/>
      <path d="M-34,12 L-46,26 L-20,12 Z" fill="#8B5CF6"/>
      <circle cx="6" cy="0" r="6" fill="#A855F7" stroke="#4C1D95" stroke-width="2"/>
      <animateTransform attributeName="transform" type="translate" values="0,105;0,97;0,105" dur="3s" repeatCount="indefinite"/>
    </g>
    <animateTransform attributeName="transform" type="translate" values="-120,0;1020,0" dur="9s" repeatCount="indefinite"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
